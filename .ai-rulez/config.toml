version = "5.0"
name = "liter-llm"
description = "Multi-language LLM library with Rust core and polyglot bindings (Python, TypeScript, Ruby, PHP, Elixir, Go, Java, C#, WASM)"
gitignore = true

presets = ["claude", "codex", "opencode", "pi"]

compact = true
builtins = [
  "rust",
  "python",
  "typescript",
  "ruby",
  "php",
  "elixir",
  "go",
  "java",
  "csharp",
  "pyo3",
  "napi-rs",
  "default-commands",
]

[header]
text = """AI-RULEZ :: GENERATED FILE - DO NOT EDIT
Source: .ai-rulez/config.toml
Modify .ai-rulez/ content and regenerate with pnpm dlx ai-rulez@5.0.1 generate
MCP server: pnpm dlx ai-rulez@5.0.1 mcp"""
style = "minimal"

hashes = "full"

[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
path = "modules/cicd"
merge_strategy = "local-override"

[[installed_skills]]
name = "alef"
source = "https://github.com/xberg-io/alef.git"

[[mcp_servers]]
name = "ai-rulez"
description = "AI-Rulez MCP server for configuration management"
command = "npx"
args = ["-y", "ai-rulez@latest", "mcp"]

[[mcp_servers]]
name = "playwright"
description = "Playwright browser automation for E2E testing and docs verification"
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[defaults]
effort = "medium"

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Plugin authoring: `ai-rulez generate --plugin` fans plugin/.ai-rulez/config.toml
# ([plugin] block) out to per-runtime bundles under plugin/ and emits the repo-root
# marketplace index. Only read by `generate --plugin`; normal governance generation ignores it.
[marketplace]
name = "liter-llm"
description = "Universal LLM API client for coding agents, by Kreuzberg, Inc."
members = ["plugin"]

[marketplace.owner]
name = "Kreuzberg, Inc."
email = "contact@xberg.io"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
