[package]
name = "liter-llm"
# NOTE (local submodule-only patch, not upstreamed): these fields are hardcoded
# instead of `*.workspace = true`. This crate is consumed by
# universal-agent-runtime as a `path` dependency nested under
# vendor/git/liter-llm (a git submodule tracking GQAdonis/liter-llm). Cargo
# resolves `*.workspace = true` inheritance against the *enclosing* workspace
# for any path dependency nested inside a workspace's directory tree, even one
# listed in that workspace's `exclude` — so inheriting from this repo's own
# `vendor/git/liter-llm/Cargo.toml` fails once nested inside UAR (whose root
# manifest has no `[workspace.package]` table). Hardcoding here mirrors the
# same fix already applied to the other vendored crates in vendor/git/
# (surreal-memory, sycophancy-core). Values must stay in sync with
# ../../Cargo.toml's `[workspace.package]` table when bumping upstream.
version = "1.11.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/xberg-io/liter-llm"
homepage = "https://xberg.io"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
description = "Universal LLM API client — 142+ providers, streaming, tool calling. Rust-powered, type-safe, compiled."
readme = "README.md"
keywords = ["llm", "openai", "api-client", "ai", "xberg"]
categories = ["api-bindings", "web-programming::http-client"]

[package.metadata.cargo-machete]
ignored = ["dashmap", "tower-http"]

[features]

# ~keep Disable `native-http` for WebAssembly; browser and Node builds use fetch
# ~keep and cannot run the Tokio multi-thread runtime.
native-http = [
    "dep:reqwest",
    # ~keep reqwest/http2 gates `ClientBuilder::http2_prior_knowledge()`, which
    # ~keep backs `TransportConfig::http2_prior_knowledge`.
    "reqwest/http2",
    # ~keep dep:rustls is only present on non-Windows; Cargo ignores optional
    # ~keep feature activations for absent target-conditional deps.
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-util",
    "dep:memchr",
    "dep:gcp_auth",
]

wasm-http = ["dep:reqwest", "dep:memchr", "dep:gloo-timers", "dep:web-time"]

tracing = ["dep:tracing"]

otel = ["tracing", "dep:tracing-opentelemetry", "dep:opentelemetry"]

tower = ["dep:tower", "dep:tower-http", "dep:futures-util", "tracing"]

opendal-cache = ["dep:opendal", "tower"]

guardrail-cel = ["dep:cel-interpreter"]

# ~keep Without `bedrock`, `BedrockProvider` still routes `bedrock/` model names
# ~keep and strips the prefix, but sends unsigned requests for mock base URLs.
bedrock = ["native-http", "dep:aws-credential-types", "dep:aws-sigv4"]

azure-auth = ["native-http"]

copilot-auth = ["native-http"]

vertex-auth = ["native-http", "dep:jsonwebtoken"]

# ~keep Back-compat alias: native-http already pulls in gcp_auth, so the ADC
# ~keep provider is reachable whenever native-http is on.
vertex-adc = ["native-http"]

bedrock-auth = ["native-http"]

http3 = ["native-http"]

tokenizer = ["dep:tokenizers"]

lite = ["native-http"]

full = [
    "native-http",
    "tower",
    "tracing",
    "otel",
    "bedrock",
    "tokenizer",
    "azure-auth",
    "copilot-auth",
    "vertex-auth",
    "vertex-adc",
    "bedrock-auth",
    "opendal-cache",
]

etcd-key-resolver = ["dep:etcd-client", "dep:hex", "dep:sha2"]

# ~keep Default remains native HTTP only so downstream `cargo build` avoids heavy deps.
default = ["native-http"]

[dependencies]
# ~keep Hardcoded (NOT `*.workspace = true`) for the same reason as the [package]
# ~keep fields above: this crate is vendored as a nested `path` dependency inside
# ~keep universal-agent-runtime's workspace, where Cargo resolves `workspace = true`
# ~keep against UAR's root manifest (which has no [workspace.dependencies]) rather
# ~keep than this repo's own. Values mirror ../../Cargo.toml [workspace.dependencies].
ahash = "0.8"
arc-swap = "1"
async-trait = "0.1"
aws-credential-types = { version = "1", optional = true }
aws-sigv4 = { version = "1", features = ["sign-http", "http1"], optional = true }
# ~keep Image data-URI helpers are transport-agnostic and must stay available
# ~keep outside `native-http` and `wasm-http`.
base64 = "0.23"
bytes = "1"
cel-interpreter = { version = "0.10", optional = true }
dashmap = "6"
etcd-client = { version = "0.19", default-features = false, optional = true }
futures-core = "0.3"
futures-util = { version = "0.3", optional = true }
gcp_auth = { version = "0.12", default-features = false, features = ["ring"], optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
hex = { version = "0.4", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"], optional = true }
memchr = { version = "2", optional = true }
opendal = { version = "0.57", default-features = false, features = [
    "services-memory",
    "services-redis",
    "services-fs",
    "services-s3",
], optional = true }
opentelemetry = { version = "0.32", features = ["metrics"], optional = true }
pin-project-lite = "0.2"
regex = "1"
rust_decimal = { version = "1", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["http", "fancy-regex"], optional = true }
tokio = { version = "1", features = ["full", "time", "rt", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
toml = "1.1"
tower = { version = "0.5", features = [
    "retry",
    "limit",
    "timeout",
    "buffer",
    "load-shed",
    "steer",
    "util",
    "discover",
    "ready-cache",
], optional = true }
tower-http = { version = "0.7", features = [
    "follow-redirect",
    "set-header",
    "sensitive-headers",
    "trace",
    "request-id",
    "cors",
    "compression-gzip",
    "catch-panic",
    "limit",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
url = "2.5"
web-time = { version = "1", optional = true }

# ~keep Non-Windows uses rustls + ring to avoid aws-lc-sys as the bundled TLS provider.
# ~keep The workspace reqwest base is TLS-agnostic; this layer supplies TLS.
[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "form", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# ~keep Windows uses SChannel via native-tls to avoid aws-lc-sys MSVC build failures.
# ~keep rustls is intentionally not pulled in on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "form", "native-tls"], optional = true }

[dev-dependencies]
ctor = "1.0"
etcd-client = { version = "0.19", default-features = false }
futures-util = "0.3"
jsonschema = "0.49"
serde_json = "1"
serial_test = "4"
tokio = { version = "1", features = ["full", "test-util", "macros"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
# ~keep unused-unit: generated FFI bridge shims (alef/swift-bridge) emit `-> ()`.
# ~keep Denying this would require patching generated output on every regen.
unused-unit = "allow"
# ~keep needless-pass-by-value: public API takes owned values for FFI-friendliness;
# ~keep changing signatures would break cross-language ABI stability.
needless-pass-by-value = "allow"
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)'] }
